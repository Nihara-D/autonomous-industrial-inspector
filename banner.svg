<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="50%" stop-color="#203A43"/>
      <stop offset="100%" stop-color="#2C5364"/>
    </linearGradient>
  </defs>

  <rect width="900" height="220" fill="url(#bg)"/>

  <g stroke="#00F5D4" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="180" x2="900" y2="180">
      <animate attributeName="y1" values="180;178;180" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="180;178;180" dur="3s" repeatCount="indefinite"/>
    </line>
  </g>

  <rect x="620" y="150" width="80" height="30" fill="#55402A"/>

  <rect x="635" y="138" width="12" height="12" fill="#E63946">
    <animate attributeName="opacity" values="1;0.5;1" dur="1.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="655" y="138" width="12" height="12" fill="#2ECC71">
    <animate attributeName="opacity" values="1;0.5;1" dur="1.6s" begin="0.3s" repeatCount="indefinite"/>
  </rect>
  <rect x="675" y="138" width="12" height="12" fill="#3498DB">
    <animate attributeName="opacity" values="1;0.5;1" dur="1.6s" begin="0.6s" repeatCount="indefinite"/>
  </rect>

  <ellipse cx="250" cy="190" rx="45" ry="12" fill="#2b2b2b"/>
  <rect x="230" y="178" width="40" height="14" fill="#F4B400"/>

  <g transform-origin="250 178">
    <animateTransform attributeName="transform" type="rotate"
      values="-8 250 178; 8 250 178; -8 250 178" dur="4s" repeatCount="indefinite"/>
    <rect x="240" y="120" width="20" height="58" rx="6" fill="#8a8a8a"/>

    <g transform-origin="250 120">
      <animateTransform attributeName="transform" type="rotate"
        values="10 250 120; -15 250 120; 10 250 120" dur="4s" repeatCount="indefinite"/>
      <rect x="242" y="70" width="16" height="52" rx="6" fill="#cfcfcf"/>

      <g transform-origin="250 70">
        <animateTransform attributeName="transform" type="rotate"
          values="-15 250 70; 20 250 70; -15 250 70" dur="4s" repeatCount="indefinite"/>
        <rect x="244" y="35" width="12" height="38" rx="5" fill="#1D6FA5"/>
        <circle cx="250" cy="34" r="7" fill="#F4B400"/>
      </g>
    </g>
  </g>

  <rect x="655" y="18" width="14" height="14" fill="#F4B400"/>
  <line x1="662" y1="32" x2="662" y2="138" stroke="#00F5D4" stroke-width="1.5" stroke-dasharray="4 4">
    <animate attributeName="stroke-opacity" values="0.1;0.6;0.1" dur="2s" repeatCount="indefinite"/>
  </line>

  <text x="40" y="60" font-family="Fira Code, monospace" font-size="30" fill="#ffffff" font-weight="700">
    Autonomous Industrial Inspector
  </text>
  <text x="40" y="90" font-family="Fira Code, monospace" font-size="16" fill="#00F5D4">
    Digital Twin — ROS 2 · Gazebo Harmonic · MoveIt 2
    <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/>
  </text>
</svg>
