# Usage on a Linux host with an X server:
#   xhost +local:docker
#   docker compose up --build
#
# Intel/AMD GPUs work through /dev/dri. For NVIDIA install nvidia-container-toolkit
# and uncomment the deploy block.
services:
  inspector:
    build: .
    image: autonomous-industrial-inspector:jazzy
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    devices:
      - /dev/dri:/dev/dri
    # deploy:
